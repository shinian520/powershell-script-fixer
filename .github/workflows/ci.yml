name: ci

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Windows 是主战场：全部 72 例（49 + 9 + 8 + 6）都在 pwsh 7.6.5 / Windows 上实测过
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 打印 pwsh 版本
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: 发布规范自检（Frontmatter + 正文结构 + 根目录不得有 package.json）
        shell: pwsh
        run: ./scripts/validate-skill.ps1

      - name: 包内脚本语法门禁
        shell: pwsh
        run: |
          $files = @(Get-ChildItem ./scripts -Filter *.ps1 | ForEach-Object { $_.FullName })
          ./scripts/ps-lint.ps1 @files

      - name: 脚本编码断言（含中文的 .ps1 必须带 UTF-8 BOM，否则 5.1 按 ANSI 解码会解析失败）
        shell: pwsh
        run: |
          $bad = @()
          $files = @(Get-ChildItem ./scripts -Filter *.ps1)
          foreach ($f in $files) {
            $b = [IO.File]::ReadAllBytes($f.FullName)
            $hasBom = ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)
            if (-not $hasBom) { $bad += $f.Name }
          }
          if ($bad.Count -gt 0) { throw "以下脚本缺少 UTF-8 BOM（5.1 下会解析失败）: $($bad -join ', ')" }
          Write-Host "BOM OK: $($files.Count) 个脚本"

      - name: Legacy compatibility (Windows PowerShell 5.1 as child process)
        shell: pwsh
        run: |
          # 用 pwsh 跑本步骤，把 5.1 当子进程调用：脚本内的 exit N 只影响子进程退出码。
          # 若直接用 shell: powershell + & 脚本，脚本的 exit 会终止整个 CI 步骤（实测踩过）。
          $ps51 = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          if (-not (Test-Path -LiteralPath $ps51)) { Write-Host 'no Windows PowerShell 5.1, skip'; exit 0 }
          $w = Join-Path $env:TEMP "legacy-ci-$PID"
          New-Item -ItemType Directory -Force -Path $w | Out-Null
          try {
            $bad = Join-Path $w 'bad.ps1'
            [IO.File]::WriteAllText($bad, ('$a = @("x"' + [char]0xFF0C + ' "y")'), [Text.UTF8Encoding]::new($true))
            $cmp = Join-Path $w 'cmp.ps1'
            [IO.File]::WriteAllText($cmp, "`$n = 5`nif (`$n > 0) { 1 }", [Text.UTF8Encoding]::new($true))

            $cases = @(
              @{ Name = 'lint fullwidth';   Exe = './scripts/ps-lint.ps1';  Arg = $bad; Expect = 1; Extra = @('-AllowLegacy') },
              @{ Name = 'lint comparison';  Exe = './scripts/ps-lint.ps1';  Arg = $cmp; Expect = 3; Extra = @('-AllowLegacy') },
              @{ Name = 'guard autofix';    Exe = './scripts/ps-guard.ps1'; Arg = $bad; Expect = 0; Extra = @('-AllowLegacy') },
              @{ Name = 'guard comparison'; Exe = './scripts/ps-guard.ps1'; Arg = $cmp; Expect = 3; Extra = @('-AllowLegacy') },
              @{ Name = 'guard no-flag';    Exe = './scripts/ps-guard.ps1'; Arg = $bad; Expect = 2; Extra = @() }
            )
            foreach ($c in $cases) {
              $argv = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', $c.Exe, $c.Arg) + $c.Extra
              & $ps51 @argv *> $null
              if ($LASTEXITCODE -ne $c.Expect) { throw "PS5.1 $($c.Name): expected exit $($c.Expect), got $LASTEXITCODE" }
              Write-Host "  ok  $($c.Name) -> exit $LASTEXITCODE"
            }
            Write-Host 'legacy 5.1 OK: lint 1/3, guard 0/3, no-flag 2'
          } finally {
            Remove-Item -LiteralPath $w -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: 回归 / 循环初版（49 例）
        shell: pwsh
        run: ./scripts/test-ps-tools.ps1

      - name: 回归 / 一条命令闭环（9 例）
        shell: pwsh
        run: ./scripts/test-guard.ps1

      - name: 回归 / -Inline 语句模式（8 例）
        shell: pwsh
        run: ./scripts/test-inline.ps1

      - name: 回归 / 报错细化（6 例）
        shell: pwsh
        run: ./scripts/test-hints.ps1

      - name: 打发布包
        shell: pwsh
        run: |
          $ver = (Select-String -Path ./SKILL.md -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          New-Item -ItemType Directory -Force -Path ./dist | Out-Null
          # 只列要发的条目：不能压 ./*，否则会把 .git 与正在写入的 dist 一起卷进去
          # （实测报 "The process cannot access the file ... because it is being used by another process"）
          # Skill 发行包：根目录只含 Skill 那套结构，绝不能带 package.json（会被判成插件）
          $items = @('./SKILL.md', './README.md', './LICENSE', './scripts', './references')
          $zipPath = "./dist/powershell-script-fixer-skill-$ver.zip"
          Compress-Archive -Path $items -DestinationPath $zipPath -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath).Path)
          $names = @($z.Entries.FullName)
          $z.Dispose()
          if ($names -notcontains 'SKILL.md') { throw 'SKILL.md 必须在 ZIP 根目录（市场解析要求）' }
          if ($names -contains 'package.json') { throw 'Skill 包内不得含 package.json' }
          Write-Host "built $zipPath ($($names.Count) entries)"

      - uses: actions/upload-artifact@v4
        with:
          name: skill-package
          path: dist/*.zip
          if-no-files-found: error

  # Linux 已验证通过（ubuntu-latest + pwsh，2026-10-20 起为硬门禁）
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 版本
        run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: 回归 / 49 例
        run: pwsh -NoProfile -File ./scripts/test-ps-tools.ps1
      - name: 回归 / 9 例
        run: pwsh -NoProfile -File ./scripts/test-guard.ps1
      - name: 回归 / 8 例 inline
        run: pwsh -NoProfile -File ./scripts/test-inline.ps1
      - name: 回归 / 6 例 hints
        run: pwsh -NoProfile -File ./scripts/test-hints.ps1