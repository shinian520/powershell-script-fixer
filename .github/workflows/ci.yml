name: ci

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Windows 是主战场：全部 58 例（49 + 9）都在 pwsh 7.6.5 / Windows 上实测过
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 打印 pwsh 版本
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: 发布规范自检（SKILL.md Frontmatter + 正文结构 + 插件壳）
        shell: pwsh
        run: ./scripts/validate-skill.ps1

      - name: 插件壳校验（可选壳：plugin-shell/ 下的 package.json / main / bundle.patch / 版本对齐）
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath ./plugin-shell/package.json)) {
            Write-Host '未提供插件壳，跳过（纯 Skill 发布）'
            exit 0
          }
          $pj = Get-Content ./plugin-shell/package.json -Raw | ConvertFrom-Json
          if (-not $pj.name) { throw 'plugin-shell/package.json 缺少 name' }
          if ($pj.version -notmatch '^\d+\.\d+\.\d+$') { throw "version 必须是精确 SemVer: $($pj.version)" }
          $ver = (Select-String -Path ./SKILL.md -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          if ($pj.version -ne $ver) { throw "版本不一致：SKILL.md=$ver / plugin-shell=$($pj.version)" }
          if (-not (Test-Path -LiteralPath (Join-Path ./plugin-shell $pj.main))) { throw "main 指向不存在的文件: $($pj.main)" }
          if (-not (Test-Path -LiteralPath (Join-Path ./plugin-shell $pj.dsh.bundle.patch))) { throw "bundle.patch 不存在: $($pj.dsh.bundle.patch)" }
          node --check ./plugin-shell/lib/index.js
          if (Test-Path -LiteralPath ./package.json) { throw '根目录不应有 package.json：Skill 形态会被市场判成插件' }
          Write-Host "plugin shell OK: $($pj.name)@$($pj.version)"

      - name: 包内脚本语法门禁
        shell: pwsh
        run: |
          $files = @(Get-ChildItem ./scripts -Filter *.ps1 | ForEach-Object { $_.FullName })
          ./scripts/ps-lint.ps1 @files

      - name: 回归 / 循环初版（49 例）
        shell: pwsh
        run: ./scripts/test-ps-tools.ps1

      - name: 回归 / 一条命令闭环（9 例）
        shell: pwsh
        run: ./scripts/test-guard.ps1

      - name: 打发布包
        shell: pwsh
        run: |
          $ver = (Select-String -Path ./SKILL.md -Pattern '^version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          New-Item -ItemType Directory -Force -Path ./dist | Out-Null
          # 只列要发的条目：不能压 ./*，否则会把 .git 与正在写入的 dist 一起卷进去
          # （实测报 "The process cannot access the file ... because it is being used by another process"）
          # Skill 发行包：根目录只含 Skill 那套结构，绝不能带 package.json（会被判成插件）
          $items = @('./SKILL.md', './README.md', './LICENSE', './scripts', './references')
          $zipPath = "./dist/powershell-script-fixer-skill-$ver.zip"
          Compress-Archive -Path $items -DestinationPath $zipPath -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipPath).Path)
          $names = @($z.Entries.FullName)
          $z.Dispose()
          if ($names -notcontains 'SKILL.md') { throw 'SKILL.md 必须在 ZIP 根目录（市场解析要求）' }
          if ($names -contains 'package.json') { throw 'Skill 包内不得含 package.json' }
          Write-Host "built $zipPath ($($names.Count) entries)"

      - uses: actions/upload-artifact@v4
        with:
          name: skill-package
          path: dist/*.zip
          if-no-files-found: error

  # Linux 已验证通过（ubuntu-latest + pwsh，2026-10-20 起为硬门禁）
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 版本
        run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: 回归 / 49 例
        run: pwsh -NoProfile -File ./scripts/test-ps-tools.ps1
      - name: 回归 / 9 例
        run: pwsh -NoProfile -File ./scripts/test-guard.ps1
